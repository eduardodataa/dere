services:
  mariadb:
    image: mariadb:11.4
    container_name: dere-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dere
      MARIADB_USER: dere
      MARIADB_PASSWORD: dere
    ports:
      - "3306:3306"
    volumes:
      - dere-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dere-mariadb-data:
