spring:
  application.name: dere-poc
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DERE_DB_URL:jdbc:mariadb://localhost:3306/dere?maxAllowedPacket=67108864}
    username: ${DERE_DB_USERNAME:dere}
    password: ${DERE_DB_PASSWORD:dere}
  jpa.hibernate.ddl-auto: none
  flyway.enabled: true
  h2.console.enabled: ${DERE_H2_CONSOLE:false}
dere:
  deployment: ${DERE_DEPLOYMENT:local}
  mock.enabled: ${DERE_MOCK_ENABLED:true}
  certificate.encryption-key: ${DERE_CERTIFICATE_ENCRYPTION_KEY}
  certificate.password-store: ${DERE_CERTIFICATE_PASSWORD_STORE:local}
  certificate.secret-dir: ${DERE_CERTIFICATE_SECRET_DIR:data/cert-secrets}
  certificate.secret-prefix: ${DERE_CERTIFICATE_SECRET_PREFIX:dere/cert}
  certificate.kms-key-id: ${DERE_CERTIFICATE_KMS_KEY_ID:}
  environment: ${DERE_ENVIRONMENT:restricted-production}
  schema-version: ${DERE_SCHEMA_VERSION:nota_2026_001}
  transmission.poll-delay-ms: ${DERE_TRANSMISSION_POLL_DELAY_MS:30000}
  transmission.http-connect-timeout-ms: ${DERE_TRANSMISSION_HTTP_CONNECT_TIMEOUT_MS:5000}
  transmission.http-read-timeout-ms: ${DERE_TRANSMISSION_HTTP_READ_TIMEOUT_MS:30000}
  transmission.http-max-attempts: ${DERE_TRANSMISSION_HTTP_MAX_ATTEMPTS:3}
  transmission.http-retry-delay-ms: ${DERE_TRANSMISSION_HTTP_RETRY_DELAY_MS:200}
  api:
    base-url: ${DERE_BASE_URL:https://api.receitafederal.gov.br/dere}
    token-url: ${RECEITA_INTEGRA_TOKEN_URL:https://api.receitafederal.gov.br/token}
  auth:
    client-id: ${DERE_CLIENT_ID:}
    client-secret: ${DERE_CLIENT_SECRET:}
