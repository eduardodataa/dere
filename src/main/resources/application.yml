spring:
  application.name: dere-poc
  datasource:
    url: ${DERE_DB_URL:jdbc:mariadb://localhost:3306/dere}
    username: ${DERE_DB_USERNAME:dere}
    password: ${DERE_DB_PASSWORD:dere}
  jpa.hibernate.ddl-auto: none
  flyway.enabled: true
  h2.console.enabled: ${DERE_H2_CONSOLE:false}
dere:
  mock.enabled: ${DERE_MOCK_ENABLED:true}
  environment: ${DERE_ENVIRONMENT:restricted-production}
  schema-version: ${DERE_SCHEMA_VERSION:nota_2026_001}
  api:
    base-url: ${DERE_BASE_URL:https://api.receitafederal.gov.br/prr-dere}
    token-url: ${RECEITA_INTEGRA_TOKEN_URL:https://api.receitafederal.gov.br/token}
  auth:
    client-id: ${DERE_CLIENT_ID:}
    client-secret: ${DERE_CLIENT_SECRET:}
